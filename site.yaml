  - file: policies/conduct-and-safety.md
    slug: conduct-and-safety
  - file: policies/conflict-and-discipline.md
    slug: conflict-and-discipline
  - file: policies/zones-and-roles.md
    slug: zones-and-roles
  - file: policies/money.md
    slug: money
  - file: policies/storage-and-donations.md
    slug: storage-and-donations
